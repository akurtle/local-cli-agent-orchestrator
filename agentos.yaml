project:
  name: Orchestrator Dev
  description: "Local multi-agent orchestration for coding-agent CLIs."

orchestrator:
  max_concurrent_agents: 3
  default_timeout_seconds: 900
  max_task_retries: 1

# Supported runtimes are "claude" and "codex". Both use the existing login for
# their installed CLI; switch temporarily with `agentctl provider codex`.
runtime:
  name: claude
  # executable: C:/path/to/claude.exe   # optional; resolved from PATH if unset
  # Every invocation is metered, so the default is the cheap model. Override per
  # agent below, or remove this to use your CLI default.
  model: claude-haiku-4-5-20251001

agents:
  manager:
    role: manager
    description: Plans and coordinates work. Does not implement.

  backend:
    role: backend
    description: Owns server-side logic, APIs, data models and migrations.

  frontend:
    role: frontend
    description: Owns UI, client state and frontend integrations.

  qa:
    role: qa
    description: Tests implementations and reports failures to their owner.

  reviewer:
    role: reviewer
    description: Reviews completed work against acceptance criteria.
